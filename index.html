<!DOCTYPE html>
<html lang="es-AR" data-page="hub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F1E9" data-light="#F6F1E9" data-dark="#12110F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="shared/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Juegos de mesa">
<script src="shared/theme.js"></script>
<title>🐴 Juegos de mesa — snatty</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B1917'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='46' fill='%23F6F1E9' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/chrome.css">
<style>
  :root {
    --bg: #F6F1E9;
    --surface: #FFFDF9;
    --ink: #1B1917;
    --muted: #6B6259;
    --line: rgba(27, 25, 23, 0.10);
    --line-strong: rgba(27, 25, 23, 0.22);
    --accent: #8C3A2A;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #12110F;
    --surface: #1C1A17;
    --ink: #F3EDE4;
    --muted: #A69B8D;
    --line: rgba(243, 237, 228, 0.12);
    --line-strong: rgba(243, 237, 228, 0.26);
    --accent: #E0604F;
    --mono-ring: rgba(243, 237, 228, 0.34);
    color-scheme: dark;
  }
  [data-theme="dark"] body {
    background:
      radial-gradient(120% 70% at 50% 0%, #1E1B18 0%, var(--bg) 55%, #0C0B0A 100%);
  }
  [data-theme="dark"] dialog { box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.8); }
  [data-theme="dark"] .btn-primary { color: #12110F; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    padding: max(26px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 70% at 50% 0%, #FFFDF8 0%, var(--bg) 55%, #EDE4D6 100%);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 780px; margin: 0 auto; }
  .kicker {
    font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px;
  }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-size: clamp(1.9rem, 8vw, 2.6rem); line-height: 1.05; margin: 0;
    letter-spacing: -0.01em;
  }
  .sub {
    font-family: Fraunces, Georgia, serif; font-style: italic;
    color: var(--muted); font-size: 1rem; margin: 8px 0 0;
  }

  .grid {
    display: grid; gap: 10px; margin: 22px 0 0;
    grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
  }
  .game {
    position: relative;
    display: flex; flex-direction: column; gap: 8px;
    padding: 14px 14px 15px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--surface);
    color: inherit; text-decoration: none; min-height: 128px;
    transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .game::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    border: 1px solid transparent; pointer-events: none;
    transition: border-color 0.2s ease;
  }
  .game:hover, .game:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -20px rgba(27, 25, 23, 0.55);
  }
  .game:hover::after, .game:focus-visible::after { border-color: var(--c, var(--accent)); }
  .game:focus-visible { outline: 2px solid var(--c, var(--accent)); outline-offset: 2px; }
  .game:active { transform: translateY(0) scale(0.995); }

  .mono {
    width: 40px; height: 40px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--mono-bg, var(--ink)); color: var(--mono-ink, #F6F1E9);
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-size: var(--mono-size, 0.95rem); letter-spacing: -0.01em;
    line-height: 1;
    box-shadow: inset 0 0 0 1px var(--mono-ring, transparent);
  }
  .game strong {
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-size: 1.02rem; letter-spacing: -0.01em; line-height: 1.15;
    margin-top: auto;
  }
  .game .meta { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }

  .credit {
    margin: 24px 0 0; text-align: center; font-size: 0.72rem;
    color: var(--muted); opacity: 0.8;
  }
  .credit strong { font-weight: 600; color: var(--ink); }

  dialog {
    width: min(420px, calc(100vw - 36px));
    padding: 22px 20px 18px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink);
    box-shadow: 0 40px 80px -40px rgba(27, 25, 23, 0.6);
  }
  dialog::backdrop { background: rgba(20, 18, 16, 0.45); backdrop-filter: blur(2px); }
  dialog h2 {
    font-family: Fraunces, Georgia, serif; font-weight: 600;
    font-size: 1.32rem; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  dialog p { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  dialog .actions { display: grid; gap: 8px; }
  .btn {
    display: grid; place-items: center; min-height: 46px; padding: 0 16px;
    border-radius: 12px; border: 1px solid var(--line-strong);
    font: inherit; font-weight: 500; text-decoration: none; color: var(--ink);
    background: transparent; cursor: pointer;
  }
  .btn-primary {
    background: var(--ink); color: #F6F1E9; border-color: var(--ink);
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .noscript {
    margin-top: 20px;
    font-size: 0.9rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .game, .game::after { transition: none; }
    .game:hover, .game:focus-visible, .game:active { transform: none; }
  }
</style>
</head>
<body>
<main>
  <p class="kicker">Juntadas</p>
  <h1>Juegos de mesa</h1>
  <p class="sub">Tocá uno y arrancás.</p>

  <div class="grid" id="gamesGrid"></div>
  <noscript>
    <p class="noscript">Esta página necesita JavaScript para mostrar y abrir los juegos.</p>
  </noscript>

  <p class="credit">Proyecto hobby hecho con amor por <strong>snatty</strong>.</p>
</main>

<dialog id="introDialog" aria-labelledby="introTitle" aria-describedby="introText">
  <h2 id="introTitle"></h2>
  <p id="introText"></p>
  <div class="actions">
    <a class="btn btn-primary" id="introGo" href="#">Ok</a>
  </div>
</dialog>

<script src="shared/games.js"></script>
<script src="shared/chrome.js"></script>
<script>
  (function () {
    var catalog = window.JUEGOS_CATALOG;
    var grid = document.getElementById("gamesGrid");
    var dialog = document.getElementById("introDialog");
    var title = document.getElementById("introTitle");
    var text = document.getElementById("introText");
    var go = document.getElementById("introGo");
    if (!catalog || !Array.isArray(catalog.games) || !grid) return;

    var origin = null;
    var activeSlug = null;
    var protocol = window.location.protocol;

    catalog.games.forEach(function (game) {
      var link = document.createElement("a");
      link.className = "game";
      link.href = catalog.resolveGameHref(game.slug, protocol);
      link.setAttribute("aria-label", "Abrir " + game.title);
      link.style.setProperty("--c", game.accent);
      link.style.setProperty("--mono-bg", game.monoBg);
      link.style.setProperty("--mono-ink", game.monoInk);
      if (game.monoSize) link.style.setProperty("--mono-size", game.monoSize);
      link.dataset.intro = "1";
      link.dataset.introSlug = game.slug;
      link.dataset.introTitle = game.title;
      link.dataset.introText = game.intro;

      var mono = document.createElement("span");
      mono.className = "mono";
      mono.setAttribute("aria-hidden", "true");
      mono.textContent = game.mono;

      var strong = document.createElement("strong");
      strong.textContent = game.title;

      var meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = game.meta;

      link.appendChild(mono);
      link.appendChild(strong);
      link.appendChild(meta);

      link.addEventListener("click", function (event) {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        if (typeof catalog.hasSeenIntro === "function" && catalog.hasSeenIntro(game.slug)) return;
        if (!dialog || !go || typeof dialog.showModal !== "function") return;
        event.preventDefault();
        origin = link;
        activeSlug = game.slug;
        title.textContent = game.title;
        text.textContent = game.intro;
        go.href = link.getAttribute("href");
        dialog.showModal();
        go.focus();
      });

      grid.appendChild(link);
    });

    if (go) {
      go.addEventListener("click", function () {
        if (activeSlug && typeof catalog.markIntroSeen === "function") {
          catalog.markIntroSeen(activeSlug);
        }
      });
    }

    if (dialog) {
      dialog.addEventListener("click", function (event) {
        if (event.target === dialog) dialog.close();
      });

      dialog.addEventListener("close", function () {
        if (origin) origin.focus();
      });
    }
  })();
</script>
</body>
</html>
